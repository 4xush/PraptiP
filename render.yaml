services:
  - type: web
    name: whiteboard-agent-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements-app.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
