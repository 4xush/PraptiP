services:
  - type: web
    name: whiteboard-agent-backend
    runtime: python
    # Repo root: install deps then run uvicorn from backend/ so `server` imports
    buildCommand: pip install -r backend/requirements-app.txt
    startCommand: cd backend && uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
